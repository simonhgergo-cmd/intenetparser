# Copy to config.toml (`iparse init` does this) and edit.
# Every source is free. Some get better with a free account or key; see comments.

[storage]
db = "data/iparse.db"
# Author names are stored only as salted hashes. Setup replaces this with a random string.
author_salt = "change-me"
# Delete posts older than this many days (0 = keep forever). Each post is ~1 KB on disk.
keep_days = 90

[http]
# Seconds between requests to a host that has no specific limit below.
# Each source runs in parallel; requests to the same host are spaced out.
min_interval = 1.0

[http.hosts]
# Built-in per-host limits (see iparse/http.py) match each service's rules.
# Override only if you get blocked (raise) or know you're allowed more (lower).
# "itunes.apple.com" = 3.0

# Which groups of people to cover. Their communities are added to the
# sources below automatically. `iparse catalog` lists all ~70 groups.
[catalog]
groups = ["*"]                 # everything; or e.g. ["audience", "region"], ["parents", "teachers"], ["*", "-gaming"]
include_sensitive = false      # health / LGBTQ+ / disability communities (labelled at community level only)

[analysis]
min_mentions = 2        # a theme needs at least this many posts to show up
top = 25                # themes per list
min_segment_posts = 10  # hide segments with fewer posts than this
workers = 0             # analysis processes; 0 = one per CPU core

[output]
report = "reports/report.html"
exports = "exports"

[schedule]
every = "12h"           # how often "keep collecting" runs; each run adds roughly 30-40 MB

# Map your own communities to audience segments (adds to the built-in list).
[segments.communities]
# "r/BabyBumps" = ["expecting parents"]
# "se/expatriates" = ["expats"]

# ---------------------------------------------------------------- sources

[sources.reddit]
enabled = true
# STRONGLY recommended, free: create a "script" app at https://www.reddit.com/prefs/apps
# and paste its id/secret here. It raises Reddit's limit from ~10 to 100 requests/min,
# which makes a full cycle about 10x faster.
# client_id = ""
# client_secret = ""
sort = "top"              # top | hot | new
time = "week"             # hour | day | week | month | year | all (for top)
posts_per_listing = 100   # 1 request per subreddit
comments_per_sub = 100    # newest comments in the subreddit, 100 per request
top_post_comments = 3     # also fetch top comments of the N best new posts (1 request each)
comments_per_post = 30
# Extra subreddits on top of the catalog groups (`iparse discover <keyword>` finds them):
subreddits = []
searches = [
  "\"is there an app\"", "\"I wish there was\"", "\"why is it so hard to\"",
  "\"I would pay for\"", "\"someone should make\"",
]

[sources.hackernews]
enabled = true
queries = ["Ask HN", "I wish there was", "is there a tool", "frustrated with", "would pay for"]
tags = ["story", "comment"]
max_per_query = 200

[sources.bluesky]
# Substitute for X/Twitter. If search returns 401/403, add a free account + app password.
enabled = true
# handle = "you.bsky.social"
# app_password = ""
queries = ["\"I wish there was\"", "\"is there an app\"", "\"so frustrating\"", "\"game changer\"",
           "\"why is it so hard\"", "\"would pay for\""]
max_per_query = 200
lang = "en"

[sources.mastodon]
enabled = true
instances = ["mastodon.social"]
hashtags = ["AskFedi"]        # plus catalog hashtags
max_per_tag = 200

[sources.stackexchange]
enabled = true
# key = ""   # free; without it you get 300 requests/day, which the full catalog can exceed
sites = []                    # catalog sites are added automatically
days = 365
max_per_site = 200

[sources.appstore]
enabled = true
country = "us"
search_terms = []             # catalog app terms are added automatically
apps_per_term = 3
pages_per_app = 2             # 50 reviews per page, max 10 pages

[sources.youtube]
# Needs a free API key: Google Cloud console -> enable "YouTube Data API v3" -> credentials.
enabled = false
# api_key = ""
queries = ["day in the life struggles", "things I wish I knew", "product review honest"]
videos_per_query = 10
comments_per_video = 100

[sources.tiktok]
# Experimental, logged-out and read-only. Needs: pip install playwright && playwright install chromium
# Against TikTok's terms of service: your call. Keep the volume low.
enabled = false
hashtags = ["momtok", "collegelife", "smallbusinesscheck", "nursetok", "teachertok", "budgeting"]
videos_per_tag = 8
comments_per_video = 50
delay_seconds = 4
headless = true

[sources.import]
# Load anything you collected yourself (Instagram/TikTok comments you copied, exports, surveys).
enabled = false
